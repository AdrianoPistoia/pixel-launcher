name: pixel_launcher
description: "Launcher pixel-art para Android."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  installed_apps: ^2.2.1
  android_intent_plus: ^6.1.0
  shared_preferences: ^2.5.5
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
